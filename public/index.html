<!DOCTYPE html>
<html>
<head>
  <title>ApolloOS</title>
  <style>
    body { background:black; color:#00f0ff; font-family: monospace; text-align:center; margin-top:40px; }
    input { padding:10px; width:300px; }
    button { padding:10px; margin-left:10px; }
    iframe { width:100%; height:80vh; border:none; margin-top:20px; }
  </style>
</head>
<body>
  <h1>ApolloOS</h1>
  <input id="url" placeholder="https://example.com" />
  <button onclick="go()">Visit</button>
  <iframe id="frame"></iframe>

  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet/dist/uv.bundle.js"></script>
  <script>
    const uv = new Ultraviolet({
      bare: "/bare/",
      prefix: "/service/",
      encodeUrl: Ultraviolet.codec.plain.encode,
      decodeUrl: Ultraviolet.codec.plain.decode
    });

    function go() {
      let url = document.getElementById("url").value;
      if (!url.startsWith("http")) url = "https://" + url;
      document.getElementById("frame").src = uv.rewriteUrl(url);
    }
  </script>
</body>
</html>
